{{- include "linkshelf.validate" . }}
{{- $secretEnvNames := include "linkshelf.secretEnvNames" . | fromYaml }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "linkshelf.fullname" . }}
  labels:
    {{- include "linkshelf.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "linkshelf.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "linkshelf.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "linkshelf.serviceAccountName" . }}
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: linkshelf
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: frontend
              containerPort: 3000
            - name: backend
              containerPort: 8085
          env:
            {{- range $name, $value := (include "linkshelf.env" . | fromYaml) }}
            - name: {{ $name }}
              value: {{ $value | quote }}
            {{- end }}
            {{- range $name, $envName := $secretEnvNames }}
            {{- with include "linkshelf.secretKey" (dict "root" $ "name" $name) }}
            - name: {{ $envName }}
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.secrets.existingSecret.name }}
                  key: {{ . }}
            {{- end }}
            {{- end }}
            {{- if .Values.postgresql.enabled }}
            {{- $user := .Values.postgresql.userDatabase }}
            {{- $dbSecret := $user.existingSecret }}
            - name: APP_DATABASE_HOST
              value: {{ include "linkshelf.postgresql.fullname" . | quote }}
            - name: APP_DATABASE_PORT
              value: {{ .Values.postgresql.service.port | default 5432 | quote }}
            - name: APP_DATABASE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ $dbSecret }}
                  key: {{ default "USERDB_USER" ($user.user).secretKey }}
            - name: APP_DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $dbSecret }}
                  key: {{ default "USERDB_PASSWORD" ($user.password).secretKey }}
            - name: APP_DATABASE_NAME
              valueFrom:
                secretKeyRef:
                  name: {{ $dbSecret }}
                  key: {{ default "POSTGRES_DB" ($user.name).secretKey }}
            {{- else }}
            {{- $dbSecret := .Values.database.existingSecret.name }}
            {{- $keys := .Values.database.existingSecret.keys }}
            - name: APP_DATABASE_HOST
              valueFrom:
                secretKeyRef:
                  name: {{ $dbSecret }}
                  key: {{ $keys.host }}
            - name: APP_DATABASE_PORT
              valueFrom:
                secretKeyRef:
                  name: {{ $dbSecret }}
                  key: {{ $keys.port }}
            - name: APP_DATABASE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ $dbSecret }}
                  key: {{ $keys.username }}
            - name: APP_DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $dbSecret }}
                  key: {{ $keys.password }}
            - name: APP_DATABASE_NAME
              valueFrom:
                secretKeyRef:
                  name: {{ $dbSecret }}
                  key: {{ $keys.database }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.extraEnvFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          startupProbe:
            {{- toYaml .Values.startupProbe | nindent 12 }}
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
