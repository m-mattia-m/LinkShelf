replicaCount: 1

image:
  repository: ghcr.io/m-mattia-m/linkshelf
  # Defaults to the chart's appVersion.
  tag: ""
  pullPolicy: IfNotPresent # @schema enum:[Always,IfNotPresent,Never]

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# Public URLs of the frontend and the backend API. Derived from the ingress
# hosts when empty. Without an ingress the image defaults apply, which suits
# `kubectl port-forward` on localhost.
frontendUrl: ""
apiUrl: ""
# Defaults to <frontendUrl>/auth/callback.
oidcRedirectUrl: ""

# Lock the API to this instance: browsers may only call it from frontendUrl or
# from the domain of a shelf, and it only answers requests addressed to the
# apiUrl host (app.strictOrigins in the backend config). It takes effect when
# the ingress is enabled, since that is what tells the chart the real public
# addresses. Set it to false to keep the API open.
strictOrigins: true

# All backend config as a list of container environment variables, in plain
# Kubernetes syntax: a literal "value", or "valueFrom" for anything that
# should come from a Secret (the chart never renders one itself - point this
# at whatever you, or something like External Secrets, already created).
# There is no separate "secrets" section: a secret is just an env entry that
# uses valueFrom instead of value, so nothing has to be kept in sync across
# sections. Entries here win over the values the chart derives (e.g. the
# ingress-derived URLs, or database.engine below).
#
# Every key of the backend config file maps to its dotted path, upper-cased
# with underscores, e.g. smtp.host -> SMTP_HOST, app.name -> APP_NAME. See
# backend/config.default.yaml for all keys. AUTHENTICATION_JWTSECRET is
# required. Bring your own database (below) needs DATABASE_HOST, _PORT,
# _USERNAME, _PASSWORD and _NAME here too, unless postgresql.enabled is true.
env: []
  # - name: AUTHENTICATION_JWTSECRET
  #   valueFrom:
  #     secretKeyRef:
  #       name: linkshelf-secrets
  #       key: jwt-secret
  # - name: SMTP_HOST
  #   value: smtp.example.com
  # - name: SMTP_FROM
  #   value: no-reply@example.com
  # - name: SMTP_TLSMODE
  #   value: starttls
  # - name: AUTHENTICATION_REGISTRATIONENABLED
  #   value: "false"
  # - name: AUTHENTICATION_EMAILVERIFICATION_ENABLED
  #   value: "false"
  # - name: AUTHENTICATION_BOOTSTRAPADMIN_EMAIL
  #   value: admin@example.com
  # - name: AUTHENTICATION_BOOTSTRAPADMIN_PASSWORD
  #   valueFrom:
  #     secretKeyRef:
  #       name: linkshelf-secrets
  #       key: admin-password
  # - name: AUTHENTICATION_BOOTSTRAPADMIN_USERNAME
  #   value: admin
  # "Forgot password?" needs working email (smtp). Turn it off without:
  # - name: AUTHENTICATION_PASSWORDRESET_ENABLED
  #   value: "false"
  # Shelves live at /<username>/<path> instead of /<path>:
  # - name: APP_USERBASEDPATHS
  #   value: "true"
  # Make the instance itself reachable on another domain too, besides the
  # ingress.frontend.host it's derived from (also add it to ingress.extraHosts
  # and ingress.tls):
  # - name: APP_ADDITIONALORIGINS
  #   value: "https://links.example.org"

# Bring your own database, with DATABASE_HOST/_PORT/_USERNAME/_PASSWORD/_NAME
# in env above. Ignored when postgresql.enabled is true.
database:
  engine: POSTGRES # @schema enum:[POSTGRES,MYSQL]
  # Extra connection parameters, e.g. sslmode=require. Empty keeps the image
  # default.
  params: ""

# Optional Postgres from the groundhog2k/postgres chart, meant for evaluation.
# Not supported on OpenShift, bring your own database there. All values under
# postgresql are passed to that chart, see
# https://github.com/groundhog2k/helm-charts/tree/master/charts/postgres
postgresql:
  enabled: false
  settings:
    # Secret with the postgres superuser password, required when enabled.
    existingSecret: ""
    superuserPassword:
      secretKey: POSTGRES_PASSWORD
  # Secret with the linkshelf database, user and password, required when
  # enabled. LinkShelf reads the same Secret.
  userDatabase:
    existingSecret: ""
    name:
      secretKey: POSTGRES_DB
    user:
      secretKey: USERDB_USER
    password:
      secretKey: USERDB_PASSWORD
  storage:
    requestedSize: 2Gi

service:
  type: ClusterIP # @schema enum:[ClusterIP,NodePort,LoadBalancer]
  frontendPort: 3000
  backendPort: 8085
  annotations: {}

# The frontend and the backend need separate hosts, the browser talks to the
# backend directly.
ingress:
  enabled: false
  className: ""
  annotations: {}
  frontend:
    host: ""
  backend:
    host: ""
  # More hosts that go to the frontend, for shelves that are served on a domain
  # of their own (a shelf's domain field). List each domain, or a wildcard like
  # "*.links.example.com" for all of them. The ingress controller has to pass
  # the original Host header on, and the domain needs a TLS certificate: add it
  # to tls below. Without a rule for it a domain never reaches LinkShelf, and
  # shelves work through their path only.
  extraHosts: []
    # - profile.example.com
    # - "*.links.example.com"
  # Also decides whether the derived URLs use https.
  tls: []
    # - secretName: linkshelf-tls
    #   hosts:
    #     - linkshelf.example.com
    #     - api.linkshelf.example.com

serviceAccount:
  create: true
  name: ""
  annotations: {}

podAnnotations: {}
podLabels: {}

# No user or group IDs on purpose: the image runs as 1001 and OpenShift's
# restricted SCC assigns its own.
podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  capabilities:
    drop:
      - ALL

resources:
  requests:
    cpu: 100m
    memory: 192Mi
  limits:
    memory: 512Mi

startupProbe:
  httpGet:
    path: /health/liveness
    port: backend
  periodSeconds: 5
  failureThreshold: 30

livenessProbe:
  httpGet:
    path: /health/liveness
    port: backend
  periodSeconds: 10

readinessProbe:
  httpGet:
    path: /health/readiness
    port: backend
  periodSeconds: 10

nodeSelector: {}
tolerations: []
affinity: {}

# Whole ConfigMaps/Secrets imported as env vars, native Kubernetes envFrom
# syntax. For individual variables, add to env above instead.
extraEnvFrom: []
extraVolumes: []
extraVolumeMounts: []

# Extra manifests, rendered with the release. Each entry is a map or a string,
# both go through `tpl`, so {{ .Release.Name }} works inside.
additionalResources: []
  # - apiVersion: v1
  #   kind: ConfigMap
  #   metadata:
  #     name: "{{ .Release.Name }}-extra"
  #   data:
  #     key: value
