replicaCount: 1

image:
  repository: ghcr.io/m-mattia-m/linkshelf
  # Defaults to the chart's appVersion.
  tag: ""
  pullPolicy: IfNotPresent # @schema enum:[Always,IfNotPresent,Never]

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# Public frontend and API URLs. Derived from the ingress hosts when empty.
frontendUrl: ""
apiUrl: ""
# Defaults to <frontendUrl>/auth/callback.
oidcRedirectUrl: ""

# Restrict the API to this instance's origins and host (app.strictOrigins). Requires the ingress.
strictOrigins: true

# Optional Plausible analytics, disabled by default.
plausible:
  enabled: false
  # Site identifier in Plausible. Defaults to the request hostname.
  domain: ""
  # Plausible instance. Defaults to Plausible Cloud.
  apiHost: ""
  # Proxy Plausible through /_plausible to reduce ad-blocker interference.
  proxy: false

# Backend config as env vars (smtp.host -> SMTP_HOST, see backend/config.default.yaml).
# Use valueFrom for secrets. AUTHENTICATION_JWTSECRET is required. Entries here override derived values.
env: []
  # - name: AUTHENTICATION_JWTSECRET
  #   valueFrom:
  #     secretKeyRef:
  #       name: linkshelf-secrets
  #       key: jwt-secret
  # - name: SMTP_HOST
  #   value: smtp.example.com
  # - name: SMTP_FROM
  #   value: no-reply@example.com
  # - name: SMTP_TLSMODE
  #   value: starttls
  # - name: AUTHENTICATION_REGISTRATIONENABLED
  #   value: "false"
  # - name: AUTHENTICATION_EMAILVERIFICATION_ENABLED
  #   value: "false"
  # - name: AUTHENTICATION_BOOTSTRAPADMIN_EMAIL
  #   value: admin@example.com
  # - name: AUTHENTICATION_BOOTSTRAPADMIN_PASSWORD
  #   valueFrom:
  #     secretKeyRef:
  #       name: linkshelf-secrets
  #       key: admin-password
  # - name: AUTHENTICATION_BOOTSTRAPADMIN_USERNAME
  #   value: admin
  # "Forgot password?" needs working email (smtp). Turn it off without:
  # - name: AUTHENTICATION_PASSWORDRESET_ENABLED
  #   value: "false"
  # Shelves live at /<username>/<path> instead of /<path>:
  # - name: APP_USERBASEDPATHS
  #   value: "true"
  # Shelf limit for new users (empty = unlimited) and a link shown at the limit:
  # - name: LIMITS_DEFAULTMAXSHELVES
  #   value: "2"
  # - name: LIMITS_UPGRADEURL
  #   value: "https://account.example.com"
  # Service token that can only read and set shelf limits, off by default:
  # - name: AUTHENTICATION_SERVICETOKEN_ENABLED
  #   value: "true"
  # - name: AUTHENTICATION_SERVICETOKEN_TOKEN
  #   valueFrom:
  #     secretKeyRef:
  #       name: linkshelf-secrets
  #       key: service-token
  # Serve the instance on another domain too (also add it to ingress.extraHosts and ingress.tls):
  # - name: APP_ADDITIONALORIGINS
  #   value: "https://links.example.org"

# Backend config file, rendered into a ConfigMap and loaded before env vars.
# Useful for lists or the oidc block. Never put secrets here.
configFile: {}
  # server:
  #   trustedProxies:
  #     - 10.0.0.0/8
  # logging:
  #   level: debug

# External database; set DATABASE_* in env. Ignored when postgresql.enabled is true.
database:
  engine: POSTGRES # @schema enum:[POSTGRES,MYSQL]
  # Extra connection parameters, e.g. sslmode=require.
  params: ""

# Optional bundled Postgres for evaluation (groundhog2k/postgres chart). Not supported on OpenShift.
postgresql:
  enabled: false
  settings:
    # Secret with the postgres superuser password, required when enabled.
    existingSecret: ""
    superuserPassword:
      secretKey: POSTGRES_PASSWORD
  # Secret with the database, user and password, required when enabled. Also read by LinkShelf.
  userDatabase:
    existingSecret: ""
    name:
      secretKey: POSTGRES_DB
    user:
      secretKey: USERDB_USER
    password:
      secretKey: USERDB_PASSWORD
  storage:
    requestedSize: 2Gi

service:
  type: ClusterIP # @schema enum:[ClusterIP,NodePort,LoadBalancer]
  frontendPort: 3000
  backendPort: 8085
  annotations: {}

# The frontend and backend need separate hosts.
ingress:
  enabled: false
  className: ""
  annotations: {}
  frontend:
    host: ""
  backend:
    host: ""
  # Extra frontend hosts for shelves with their own domain (wildcards allowed). Add them to tls too.
  extraHosts: []
    # - profile.example.com
    # - "*.links.example.com"
  # Also decides whether the derived URLs use https.
  tls: []
    # - secretName: linkshelf-tls
    #   hosts:
    #     - linkshelf.example.com
    #     - api.linkshelf.example.com

serviceAccount:
  create: true
  name: ""
  annotations: {}

podAnnotations: {}
podLabels: {}

# No user/group IDs: the image runs as 1001 and OpenShift assigns its own.
podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  capabilities:
    drop:
      - ALL

resources:
  requests:
    cpu: 100m
    memory: 192Mi
  limits:
    memory: 512Mi

startupProbe:
  httpGet:
    path: /health/liveness
    port: backend
  periodSeconds: 5
  failureThreshold: 30

livenessProbe:
  httpGet:
    path: /health/liveness
    port: backend
  periodSeconds: 10

readinessProbe:
  httpGet:
    path: /health/readiness
    port: backend
  periodSeconds: 10

nodeSelector: {}
tolerations: []
affinity: {}

# ConfigMaps/Secrets imported via envFrom.
extraEnvFrom: []
extraVolumes: []
extraVolumeMounts: []

# Extra manifests rendered with the release (passed through tpl).
additionalResources: []
  # - apiVersion: v1
  #   kind: ConfigMap
  #   metadata:
  #     name: "{{ .Release.Name }}-extra"
  #   data:
  #     key: value
