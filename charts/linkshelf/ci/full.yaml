env:
  - name: AUTHENTICATION_JWTSECRET
    valueFrom:
      secretKeyRef:
        name: linkshelf-secrets
        key: jwt
  - name: AUTHENTICATION_BOOTSTRAPADMIN_EMAIL
    value: admin@example.com
  - name: AUTHENTICATION_BOOTSTRAPADMIN_PASSWORD
    valueFrom:
      secretKeyRef:
        name: linkshelf-secrets
        key: admin-password
  - name: SMTP_PASSWORD
    valueFrom:
      secretKeyRef:
        name: linkshelf-secrets
        key: smtp-password
  - name: DATABASE_HOST
    valueFrom:
      secretKeyRef:
        name: linkshelf-db
        key: host
  - name: DATABASE_PORT
    valueFrom:
      secretKeyRef:
        name: linkshelf-db
        key: port
  - name: DATABASE_USERNAME
    valueFrom:
      secretKeyRef:
        name: linkshelf-db
        key: username
  - name: DATABASE_PASSWORD
    valueFrom:
      secretKeyRef:
        name: linkshelf-db
        key: password
  - name: DATABASE_NAME
    valueFrom:
      secretKeyRef:
        name: linkshelf-db
        key: database
database:
  engine: MYSQL
  params: charset=utf8mb4&parseTime=true
configFile:
  server:
    trustedProxies:
      - 10.0.0.0/8
  logging:
    level: debug
ingress:
  enabled: true
  className: nginx
  frontend:
    host: links.example.com
  backend:
    host: api.example.com
  # Shelves served on a domain of their own go to the frontend as well.
  extraHosts:
    - profile.example.com
    - "*.shelves.example.com"
  tls:
    - secretName: linkshelf-tls
      hosts:
        - links.example.com
        - api.example.com
        - profile.example.com
