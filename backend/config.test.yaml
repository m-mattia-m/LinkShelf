app:
  name: LinkShelfTest
  description: LinkShelf is an OpenSource alternative to linktree.
  environment: development
  frontendUrl: "http://localhost:3000"
  additionalOrigins: []
  userBasedPaths: false
server:
  scheme: http
  host: localhost
  port: 18081
  trustedProxies:
    - 127.0.0.1
database:
  engine: POSTGRES # MYSQL # POSTGRES
  host: localhost
  port: 15432 # 3306 # 5432
  username: linkshelf
  password: linkshelf
  name: linkshelf
  params: "sslmode=disable" # "charset=utf8mb4&parseTime=true" # "sslmode=disable" # optional
logging:
  level: debug
domain:
  openapi:
    usePort: true
authentication:
  type: LOCAL
  # Only for automated tests - startup refuses secrets under 32 bytes.
  jwtSecret: "test-secret-for-automated-tests-only-0123456789"
  accessTokenExpiryMinutes: 5
  refreshTokenExpiryMinutes: 1440
  bootstrapAdmin:
    email: ""
    password: ""
    username: admin
  oidc:
    issuer: ""
    clientId: ""
    clientSecret: ""
    redirectUrl: ""
  localAuthEnabled: true
  registrationEnabled: true
  emailVerification:
    enabled: false
    tokenExpiryHours: 24
  passwordReset:
    enabled: false
    tokenExpiryMinutes: 60
smtp:
  host: ""
  port: 1025
  username: ""
  password: ""
  from: ""
  tlsMode: none
