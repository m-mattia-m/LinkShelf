app:
  name: LinkShelf
  description: LinkShelf is an OpenSource alternative to linktree.
  environment: production
  frontendUrl: "http://localhost:3000"
  # Other origins the frontend is served on. Allowed by strictOrigins and reserved from shelf domains.
  additionalOrigins: []
  # true: shelf URLs are /<username>/<path>. false: /<path>, unique per instance.
  userBasedPaths: false
  # Only allow browser calls from known origins and requests addressed to server.host (else 421).
  # Requires frontendUrl and server.host to be the real public values.
  strictOrigins: false
server:
  scheme: http
  host: localhost
  port: 8085 # Do not change this port since the Containerfile exposes this port. It's just for development purposes.
  trustedProxies:
    - 127.0.0.1
database:
  engine: POSTGRES # MYSQL # POSTGRES
  host: localhost
  port: 15432 # 3306 # 5432
  username: linkshelf
  password: linkshelf
  name: linkshelf
  params: "sslmode=disable" # "charset=utf8mb4&parseTime=true" # "sslmode=disable" # optional
logging:
  level: info
domain:
  openapi:
    usePort: false
themes:
  # Directory of instance-theme YAML files, synced at startup. Defaults to the bundled themes; "" disables them.
  directory: "themes"
assets:
  # Directory of static files (e.g. theme background images) served at basePath. "" disables it.
  directory: ""
  basePath: "/images"
authentication:
  type: LOCAL # LOCAL # OIDC
  # Required, at least 32 bytes, e.g. `openssl rand -base64 48`. Set via AUTHENTICATION_JWTSECRET.
  jwtSecret: ""
  accessTokenExpiryMinutes: 5
  refreshTokenExpiryMinutes: 1440 # 24h
  bootstrapAdmin:
    # Admin created on startup if the email doesn't exist yet. Leave empty to skip.
    email: ""
    # Max 72 bytes (bcrypt limit).
    password: ""
    # Not validated, so it may be a reserved word.
    username: admin
  oidc:
    # issuer and clientId are required when type is OIDC.
    issuer: ""
    clientId: ""
    # Optional: PKCE is always used.
    clientSecret: ""
    redirectUrl: "http://localhost:3000/auth/callback"
  # false disables password login, registration and reset. Only allowed with OIDC.
  localAuthEnabled: true
  # false disables public self-registration.
  registrationEnabled: true
  emailVerification:
    # Requires smtp.host and smtp.from. OIDC accounts are exempt.
    enabled: true
    tokenExpiryHours: 24
  passwordReset:
    # Requires smtp.host and smtp.from.
    enabled: true
    tokenExpiryMinutes: 60
smtp:
  # Defaults to the Mailpit dev container.
  host: localhost
  port: 1025
  username: ""
  password: ""
  from: "no-reply@linkshelf.local"
  # Optional display name for the From header.
  fromName: ""
  # none | starttls | tls
  tlsMode: none
