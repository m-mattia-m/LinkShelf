app:
  name: LinkShelf
  description: LinkShelf is an OpenSource alternative to linktree.
  environment: production
  frontendUrl: "http://localhost:3000"
  # Other origins the frontend is served on. Allowed by strictOrigins and reserved from shelf domains.
  additionalOrigins: []
  # true: shelf URLs are /<username>/<path>. false: /<path>, unique per instance.
  userBasedPaths: false
  # Only allow browser calls from known origins and requests addressed to server.host (else 421).
  # Requires frontendUrl and server.host to be the real public values.
  strictOrigins: false
  # External links in the dashboard sidebar, opened in a new tab. icon is an Iconify name (optional).
  sidebarLinks: []
  # sidebarLinks:
  #   - name: Status
  #     url: https://status.example.com
  #     icon: i-lucide-activity
server:
  scheme: http
  host: localhost
  port: 8085 # Do not change this port since the Containerfile exposes this port. It's just for development purposes.
  trustedProxies:
    - 127.0.0.1
database:
  engine: POSTGRES # MYSQL # POSTGRES
  host: localhost
  port: 15432 # 3306 # 5432
  username: linkshelf
  password: linkshelf
  name: linkshelf
  params: "sslmode=disable" # "charset=utf8mb4&parseTime=true" # "sslmode=disable" # optional
logging:
  level: info
domain:
  openapi:
    usePort: false
themes:
  # Directory of instance-theme YAML files, synced at startup. Defaults to the bundled themes; "" disables them.
  directory: "themes"
assets:
  # Directory of static files (e.g. theme background images) served at basePath. "" disables it.
  directory: ""
  basePath: "/images"
authentication:
  type: LOCAL # LOCAL # OIDC
  # Required, at least 32 bytes, e.g. `openssl rand -base64 48`. Set via AUTHENTICATION_JWTSECRET.
  jwtSecret: ""
  accessTokenExpiryMinutes: 5
  refreshTokenExpiryMinutes: 1440 # 24h
  bootstrapAdmin:
    # Admin created on startup if the email doesn't exist yet. Leave empty to skip.
    email: ""
    # Max 72 bytes (bcrypt limit).
    password: ""
    # Not validated, so it may be a reserved word.
    username: admin
  oidc:
    # issuer and clientId are required when type is OIDC.
    issuer: ""
    clientId: ""
    # Optional: PKCE is always used.
    clientSecret: ""
    redirectUrl: "http://localhost:3000/auth/callback"
    # Optional: scopes requested in addition to openid, profile and email.
    # e.g. Zitadel: ["urn:zitadel:iam:org:id:<org-id>"] to use that org's login policy and IdPs.
    extraScopes: []
    # Optional: further redirect URLs a client may request with
    # GET /v1/auth/oidc/login?redirect_url=..., e.g. a separate site that signs in
    # through this same OIDC client. Exact match only. Each one must also be
    # registered as a redirect URI at the identity provider.
    additionalRedirectUrls: []
  # false disables password login, registration and reset. Only allowed with OIDC.
  localAuthEnabled: true
  # false disables public self-registration.
  registrationEnabled: true
  emailVerification:
    # Requires smtp.host and smtp.from. OIDC accounts are exempt.
    enabled: true
    tokenExpiryHours: 24
  passwordReset:
    # Requires smtp.host and smtp.from.
    enabled: true
    tokenExpiryMinutes: 60
  # Static bearer token for an external service. It can only call the service endpoints
  # its scopes allow, and no user endpoint.
  serviceToken:
    enabled: false
    # limits: read and set a user's shelf limit.
    # domains:read: list the custom domains (GET /v1/service/domains).
    # domains:write-status: write back the status of a domain (PUT /v1/service/domains/{domain}/status).
    # Set via AUTHENTICATION_SERVICETOKEN_SCOPES, comma separated.
    scopes: [limits]
    # Required when enabled, at least 32 bytes and different from jwtSecret, e.g. `openssl rand -base64 48`.
    # Set via AUTHENTICATION_SERVICETOKEN_TOKEN.
    token: ""
limits:
  # Shelf limit copied onto new users. Empty = unlimited. Existing users are not changed.
  defaultMaxShelves:
  # Optional http(s) link shown to users who hit a limit.
  upgradeUrl: ""
customDomains:
  # false: every saved domain is served and its status is informational.
  # true: a domain is served only while an external controller reports it as "ready"
  # (see PUT /v1/service/domains/{domain}/status), and "one domain, one shelf" only
  # applies among ready domains. Prevents squatting a domain before proving it.
  requireReady: false
webhooks:
  # Notifies external services that something changed. Best effort, see the docs
  # "Automating custom domains". The receiver must be able to resync from the API.
  enabled: false
  # - url: https://example.com/hooks/linkshelf
  #   secret: ${WEBHOOKS_EXAMPLE_SECRET}   # read from the environment, at least 32 bytes
  #   events: ["shelf.domain.changed"]     # or ["*"]
  endpoints: []
smtp:
  # Defaults to the Mailpit dev container.
  host: localhost
  port: 1025
  username: ""
  password: ""
  from: "no-reply@linkshelf.local"
  # Optional display name for the From header.
  fromName: ""
  # none | starttls | tls
  tlsMode: none
