name: Release – Plan, Test, Version & Publish

# The version is derived by semantic-release from the Conventional Commits on
# main (see .releaserc.json), never picked by hand. Triggers:
#   - push to main from anyone but Dependabot: releases right away and sweeps
#     up any dependency updates that are still waiting
#   - weekly cron: releases whatever Dependabot merged since the last release
#   - manual run (workflow_dispatch)
# Dependabot's own merges never trigger a run, so a week of dependency updates
# ends up in one release instead of one release per PR.
on:
  push:
    branches: [main]
  schedule:
    - cron: '0 6 * * 2'
  workflow_dispatch:

env:
  IMAGE_NAME: linkshelf
  REGISTRY: ghcr.io
  OWNER: ${{ github.repository_owner }}

# Runs must not overlap (two releases would race for the same next version),
# and a queued run must not be cancelled: it still has to pick up its commits.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Dry run: is there anything releasable since the last tag? Saves the test
  # suite and image build for pushes (docs, chore, ...) that produce no release.
  plan:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name != 'push' || github.event.head_commit.author.name != 'dependabot[bot]')
    runs-on: ubuntu-latest

    # write, not read: semantic-release verifies push access even in a dry run.
    permissions:
      contents: write

    outputs:
      release: ${{ steps.plan.outputs.release }}
      version: ${{ steps.plan.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'

      - name: Determine next version (dry run)
        id: plan
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npx --yes semantic-release@24 --dry-run 2>&1 | tee plan.log
          version=$(sed -n 's/.*The next release version is \(.*\)$/\1/p' plan.log | tail -1)
          if [ -n "$version" ]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "version=$version" >> "$GITHUB_OUTPUT"
            echo "Next release: v$version" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "No releasable changes since the last release." >> "$GITHUB_STEP_SUMMARY"
          fi

  test-and-coverage:
    needs: plan
    if: needs.plan.outputs.release == 'true'
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache: true

      - name: Build
        working-directory: backend
        run: |
          go build ./...

      - name: Install mockgen
        run: |
          go install go.uber.org/mock/mockgen@latest

      - name: Verify go generate is up-to-date
        working-directory: backend
        run: |
          go generate ./...
          git diff --exit-code

      - name: Run unit tests
        working-directory: backend
        run: |
          PKGS=$(go list ./... | grep -Ev '/(mocks|config|cmd|migrations)')
          go test $PKGS -coverprofile=coverage.unit.out

      - name: Run integration tests
        working-directory: backend
        run: |
          PKGS=$(go list -tags=integration ./... | grep -Ev '/(mocks|config|cmd|migrations)')
          go test -tags=integration $PKGS -coverprofile=coverage.integration.out

      - name: Merge coverage
        working-directory: backend
        run: |
          echo "mode: atomic" > ../coverage.out
          grep -h -v "^mode:" coverage.unit.out coverage.integration.out >> ../coverage.out

      - name: Coverage summary
        working-directory: backend
        run: |
          echo "-------------------------------"
          go tool cover -func=../coverage.out | tee coverage.txt
          echo "-------------------------------"
          grep total: coverage.txt

      - name: check test coverage
        uses: vladopajic/go-test-coverage@v2
        with:
          profile: coverage.out
          threshold-total: 0
          debug: true

  # Creates the tag and the GitHub Release (with generated notes). Everything
  # after this job builds from that tag. With GITHUB_TOKEN the release event
  # doesn't trigger other workflows, which is why build and chart publishing
  # live in this same workflow and receive the tag as a job output.
  release:
    needs: [plan, test-and-coverage]
    runs-on: ubuntu-latest

    permissions:
      contents: write

    outputs:
      tag: ${{ steps.release.outputs.tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'

      - name: Create release
        id: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npx --yes semantic-release@24 2>&1 | tee release.log
          tag=$(sed -n 's/.*Created tag \(v[^ ]*\).*/\1/p' release.log | tail -1)
          if [ -z "$tag" ]; then
            echo "semantic-release did not create a tag"; exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Released $tag" >> "$GITHUB_STEP_SUMMARY"

  build-and-push:
    needs: release
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    env:
      IMAGE_TAG: ${{ needs.release.outputs.tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.tag }}

      - name: Set up QEMU for cross-arch emulation
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user-static

      - name: Install buildah
        run: |
          sudo apt-get install -y buildah
          buildah version

      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | buildah login --username "${{ github.actor }}" --password-stdin "$REGISTRY"

      - name: Build multi-arch OCI image
        run: |
          buildah manifest create "$IMAGE_NAME"

          for arch in amd64 arm64; do
            buildah build \
              --arch "$arch" \
              --os linux \
              --manifest "$IMAGE_NAME" \
              --file .container/Containerfile \
              --build-arg "IMAGE_NAME=$IMAGE_NAME" \
              --build-arg "IMAGE_TAG=$IMAGE_TAG" \
              --label "org.opencontainers.image.version=$IMAGE_TAG" \
              --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
              .
          done

      - name: Push multi-arch OCI image
        run: |
          buildah manifest push --all "$IMAGE_NAME" "docker://$REGISTRY/$OWNER/$IMAGE_NAME:$IMAGE_TAG"
          buildah manifest push --all "$IMAGE_NAME" "docker://$REGISTRY/$OWNER/$IMAGE_NAME:latest"

  publish-chart:
    # The chart defaults to the image built above, so publish it afterwards.
    needs: [release, build-and-push]
    runs-on: ubuntu-latest

    permissions:
      contents: write

    env:
      CR_VERSION: 1.8.1
      IMAGE_TAG: ${{ needs.release.outputs.tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.tag }}
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Ensure the gh-pages branch exists
        run: |
          if ! git ls-remote --exit-code --heads origin gh-pages > /dev/null; then
            git switch --orphan gh-pages
            git commit --allow-empty -m "chore: initialize gh-pages"
            git push origin gh-pages
            git switch --detach "$IMAGE_TAG"
          fi

      - name: Stamp chart version
        working-directory: charts/linkshelf
        run: |
          version="${IMAGE_TAG#v}"
          if ! echo "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "release tag '$IMAGE_TAG' is not a semantic version"; exit 1
          fi
          sed -i.bak -e "s/^version: .*/version: $version/" -e "s/^appVersion: .*/appVersion: \"$IMAGE_TAG\"/" Chart.yaml
          rm Chart.yaml.bak
          grep -E '^(version|appVersion):' Chart.yaml

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: v3.18.4

      - name: Install chart-releaser
        run: |
          curl -sSL "https://github.com/helm/chart-releaser/releases/download/v${CR_VERSION}/chart-releaser_${CR_VERSION}_linux_amd64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin cr

      - name: Package chart
        run: |
          helm repo add groundhog2k https://groundhog2k.github.io/helm-charts/
          helm dependency build charts/linkshelf
          cr package charts/linkshelf

      # The chart gets its own GitHub Release (linkshelf-<version>) that holds
      # the .tgz. It must not take over the "Latest" badge from the app release.
      - name: Upload chart and update the Helm repository index
        env:
          CR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cr upload --owner "$OWNER" --git-repo "${GITHUB_REPOSITORY#*/}" --make-release-latest=false --skip-existing
          cr index --owner "$OWNER" --git-repo "${GITHUB_REPOSITORY#*/}" --push
