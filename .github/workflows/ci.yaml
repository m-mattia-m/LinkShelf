name: CI – Build, Test & Coverage

on:
  push:
    branches:
      - main
      - develop
      - 'develop/**'
      - 'feat/**'
      - 'chore/**'
      - 'docs/**'
      - 'fix/**'
      - 'refactor/**'
      - 'style/**'
      - 'test/**'
      # Dependabot's own branch prefix - without this, CI never runs on its
      # PRs, so the "require status checks" branch rule can never be
      # satisfied and auto-merge hangs forever waiting on a check that was
      # never reported.
      - 'dependabot/**'

env:
  IMAGE_NAME: linkshelf

jobs:
  ci:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache: true

      - name: Install mockgen
        run: |
          go install go.uber.org/mock/mockgen@latest

      - name: Build
        working-directory: backend
        run: |
          go build ./...

      - name: Verify go generate is up-to-date
        working-directory: backend
        run: |
          go generate ./...
          git diff --exit-code


      - name: Run unit tests
        working-directory: backend
        run: |
          go list ./... | grep -Ev '/(mocks|config|cmd|migrations)' | xargs go test -coverprofile=coverage.unit.out

      - name: Run integration tests
        working-directory: backend
        run: |
          go list -tags=integration ./... | grep -Ev '/(mocks|config|cmd|migrations)' | xargs go test -tags=integration -coverprofile=coverage.integration.out

      # These two run every repository function against a real, throwaway
      # Postgres/MySQL container (via testcontainers-go) instead of sqlmock,
      # so a change that only breaks one engine's actual SQL dialect is
      # caught here rather than shipped. database.engine is picked up from
      # APP_DATABASE_ENGINE by config.LoadConfig().
      #
      # -run RealDB restricts execution to this tier's own tests (all named
      # Test_RealDB_*) - the package's other (untagged) sqlmock tests still
      # compile here too, but must NOT run under this env's database.engine:
      # they assume the default test config's engine (Postgres) regardless
      # of which real one is under test in a given leg.
      - name: Run repository tests against real Postgres
        working-directory: backend
        env:
          APP_DATABASE_ENGINE: postgres
        run: |
          go test -tags=realdb -run RealDB -coverprofile=coverage.realdb.postgres.out backend/internal/infrastructure/repository

      - name: Run repository tests against real MySQL
        working-directory: backend
        env:
          APP_DATABASE_ENGINE: mysql
        run: |
          go test -tags=realdb -run RealDB -coverprofile=coverage.realdb.mysql.out backend/internal/infrastructure/repository

      - name: Merge coverage
        working-directory: backend
        run: |
          echo "mode: atomic" > ../coverage.out
          grep -h -v "^mode:" coverage.unit.out coverage.integration.out coverage.realdb.postgres.out coverage.realdb.mysql.out >> ../coverage.out

      - name: Coverage summary
        working-directory: backend
        run: |
          echo "-------------------------------"
          go tool cover -func=../coverage.out | tee coverage.txt
          echo "-------------------------------"
          grep total: coverage.txt

      - name: check test coverage
        uses: vladopajic/go-test-coverage@v2
        with:
          profile: coverage.out
          threshold-total: 80
          debug: true

          git-token: ${{ github.ref_name == 'main' && secrets.GITHUB_TOKEN || '' }}
          git-branch: badges
          git-file-name: .badges/main/coverage.svg

  frontend:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Run tests with coverage
        working-directory: frontend
        run: npm run test:coverage

      - name: Checkout badges branch
        if: github.ref_name == 'main'
        uses: actions/checkout@v7
        with:
          ref: badges
          path: badges-branch

      - name: Generate coverage badge
        if: github.ref_name == 'main'
        uses: wjervis7/vitest-badge-action@v1.0.0
        with:
          result-type: lines
          vitest-config-path: frontend/vitest.config.ts
          summary-path: frontend/coverage/coverage-summary.json
          badge-path: badges-branch/.badges/main/coverage-frontend.svg
          badge-text: coverage
          upload-badge: false

      - name: Commit coverage badge
        if: github.ref_name == 'main'
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          repository: badges-branch
          commit_message: update frontend badge .badges/main/coverage-frontend.svg
          file_pattern: .badges/main/coverage-frontend.svg

  # Builds the release image for both architectures without pushing it, so a
  # broken base-image bump (Dependabot's docker ecosystem) or a Containerfile
  # change can't auto-merge unnoticed. Mirrors build-and-push in release.yaml.
  container:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up QEMU for cross-arch emulation
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user-static

      - name: Install buildah
        run: |
          sudo apt-get install -y buildah
          buildah version

      - name: Build multi-arch OCI image (not pushed)
        run: |
          buildah manifest create "$IMAGE_NAME"

          for arch in amd64 arm64; do
            buildah build \
              --arch "$arch" \
              --os linux \
              --manifest "$IMAGE_NAME" \
              --file .container/Containerfile \
              --build-arg "IMAGE_NAME=$IMAGE_NAME" \
              --build-arg "IMAGE_TAG=ci-${GITHUB_SHA::7}" \
              .
          done

  chart:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    defaults:
      run:
        working-directory: charts/linkshelf

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: v3.18.4

      - name: Install helm-values-schema-json
        run: helm plugin install https://github.com/losisin/helm-values-schema-json.git --version 2.6.0

      - name: Build dependencies
        run: |
          helm repo add groundhog2k https://groundhog2k.github.io/helm-charts/
          helm dependency build

      - name: Verify values.schema.json is up-to-date
        run: |
          helm schema
          git diff --exit-code values.schema.json

      - name: Lint and template
        run: |
          for values in ci/*.yaml; do
            echo "::group::$values"
            helm lint --strict . -f "$values"
            helm template ci . -f "$values" > "$RUNNER_TEMP/rendered.yaml"
            if grep -q '^kind: Secret$' "$RUNNER_TEMP/rendered.yaml"; then
              echo "the chart must not render Secrets, use existing ones"; exit 1
            fi
            echo "::endgroup::"
          done

      - name: Verify required values are enforced
        run: |
          expect_failure() {
            local message="$1"; shift
            if output=$(helm template ci . "$@" 2>&1); then
              echo "expected helm template to fail: $*"; exit 1
            fi
            echo "$output" | grep -q -- "$message" || { echo "unexpected error: $output"; exit 1; }
          }

          expect_failure "secrets.existingSecret.name" --set database.existingSecret.name=db
          expect_failure "keys.jwtSecret" -f ci/minimal.yaml --set secrets.existingSecret.keys.jwtSecret=
          expect_failure "configure a database" --set secrets.existingSecret.name=s
          expect_failure "bootstrapAdminPassword" -f ci/minimal.yaml --set env.APP_AUTHENTICATION_BOOTSTRAPADMIN_EMAIL=a@b.c
          expect_failure "cannot be combined" -f ci/bundled-postgres.yaml --set database.existingSecret.name=db
          expect_failure "postgresql.settings.existingSecret" -f ci/bundled-postgres.yaml --set postgresql.settings.existingSecret=
          expect_failure "ingress.frontend.host" -f ci/minimal.yaml --set ingress.enabled=true
