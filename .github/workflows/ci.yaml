name: CI – Build, Test & Coverage

on:
  push:
    branches:
      - main
      - develop
      - 'develop/**'
      - 'feat/**'
      - 'chore/**'
      - 'docs/**'
      - 'fix/**'
      - 'refactor/**'
      - 'style/**'
      - 'test/**'
      # Dependabot's own branch prefix - without this, CI never runs on its
      # PRs, so the "require status checks" branch rule can never be
      # satisfied and auto-merge hangs forever waiting on a check that was
      # never reported.
      - 'dependabot/**'

env:
  IMAGE_NAME: linkshelf

jobs:
  ci:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache: true

      - name: Install mockgen
        run: |
          go install go.uber.org/mock/mockgen@latest

      - name: Build
        working-directory: backend
        run: |
          go build ./...

      - name: Verify go generate is up-to-date
        working-directory: backend
        run: |
          go generate ./...
          git diff --exit-code


      - name: Run unit tests
        working-directory: backend
        run: |
          go list ./... | grep -Ev '/(mocks|config|cmd|migrations)' | xargs go test -coverprofile=coverage.unit.out

      - name: Run integration tests
        working-directory: backend
        run: |
          go list -tags=integration ./... | grep -Ev '/(mocks|config|cmd|migrations)' | xargs go test -tags=integration -coverprofile=coverage.integration.out

      # These two run every repository function against a real, throwaway
      # Postgres/MySQL container (via testcontainers-go) instead of sqlmock,
      # so a change that only breaks one engine's actual SQL dialect is
      # caught here rather than shipped. database.engine is picked up from
      # APP_DATABASE_ENGINE by config.LoadConfig().
      #
      # -run RealDB restricts execution to this tier's own tests (all named
      # Test_RealDB_*) - the package's other (untagged) sqlmock tests still
      # compile here too, but must NOT run under this env's database.engine:
      # they assume the default test config's engine (Postgres) regardless
      # of which real one is under test in a given leg.
      - name: Run repository tests against real Postgres
        working-directory: backend
        env:
          APP_DATABASE_ENGINE: postgres
        run: |
          go test -tags=realdb -run RealDB -coverprofile=coverage.realdb.postgres.out backend/internal/infrastructure/repository

      - name: Run repository tests against real MySQL
        working-directory: backend
        env:
          APP_DATABASE_ENGINE: mysql
        run: |
          go test -tags=realdb -run RealDB -coverprofile=coverage.realdb.mysql.out backend/internal/infrastructure/repository

      - name: Merge coverage
        working-directory: backend
        run: |
          echo "mode: atomic" > ../coverage.out
          grep -h -v "^mode:" coverage.unit.out coverage.integration.out coverage.realdb.postgres.out coverage.realdb.mysql.out >> ../coverage.out

      - name: Coverage summary
        working-directory: backend
        run: |
          echo "-------------------------------"
          go tool cover -func=../coverage.out | tee coverage.txt
          echo "-------------------------------"
          grep total: coverage.txt

      - name: check test coverage
        uses: vladopajic/go-test-coverage@v2
        with:
          profile: coverage.out
          threshold-total: 80
          debug: true

          git-token: ${{ github.ref_name == 'main' && secrets.GITHUB_TOKEN || '' }}
          git-branch: ${{ github.ref_name }}

  frontend:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Run tests with coverage
        working-directory: frontend
        run: npm run test:coverage

      - name: Generate coverage badge
        if: github.ref_name == 'main'
        working-directory: frontend
        run: node scripts/generate-coverage-badge.mjs "${{ github.ref_name }}"

      - name: Commit coverage badge
        if: github.ref_name == 'main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .badges
          git diff --cached --quiet || git commit -m "update frontend badge .badges/${{ github.ref_name }}/coverage-frontend.svg"
          git push
