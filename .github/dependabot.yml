# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "npm"
    directory: "frontend"
    schedule:
      interval: "weekly"

  - package-ecosystem: "gomod"
    directory: "backend"
    schedule:
      interval: "weekly"

  # Picks up backend/frontend/runtime base images in .container/Containerfile
  # (dependabot's docker ecosystem matches any file named "Dockerfile" or
  # "Containerfile" in this directory).
  - package-ecosystem: "docker"
    directory: ".container"
    schedule:
      interval: "weekly"

  # Picks up image references in compose.yaml and compose.dev.yaml at the
  # repo root.
  - package-ecosystem: "docker-compose"
    directory: ""
    schedule:
      interval: "weekly"

  - package-ecosystem: "github-actions"
    directory: ".github/workflows"
    schedule:
      interval: "weekly"
