# Dependabot opens its PRs on a schedule (Monday, UTC) - it does not react to
# pull requests. Minor/patch updates are grouped per ecosystem so a week
# produces a handful of PRs instead of dozens; major updates are excluded from
# the groups and arrive as their own PRs (and are never auto-merged, see
# workflows/dependabot-auto-merge.yaml).
#
# The commit-message prefix drives semantic-release (workflows/release.yaml):
#   fix(deps)      -> patch release (npm, gomod and container base images ship
#                     inside the image)
#   chore(<scope>) -> no release (CI-only, chart-only or dev-only changes)

version: 2
updates:
  - package-ecosystem: "npm"
    directory: "frontend"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "fix(deps)"
    groups:
      npm-production:
        dependency-type: "production"
        update-types: ["minor", "patch"]
      npm-development:
        dependency-type: "development"
        update-types: ["minor", "patch"]

  - package-ecosystem: "gomod"
    directory: "backend"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "fix(deps)"
    groups:
      go-modules:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # Picks up backend/frontend/runtime base images in .container/Containerfile
  # (dependabot's docker ecosystem matches any file named "Dockerfile" or
  # "Containerfile" in this directory).
  - package-ecosystem: "docker"
    directory: ".container"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "fix(deps)"
    groups:
      container-base-images:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # Picks up image references in compose.yaml and compose.dev.yaml at the
  # repo root. Those files are local-development infrastructure, so their
  # updates must not cut a release.
  - package-ecosystem: "docker-compose"
    directory: ""
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "chore(compose)"
    groups:
      compose-images:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: ".github/workflows"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "chore(ci)"
    groups:
      github-actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # Picks up the postgres dependency in charts/linkshelf/Chart.yaml. Never
  # auto-merged.
  - package-ecosystem: "helm"
    directory: "charts/linkshelf"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "chore(helm)"
